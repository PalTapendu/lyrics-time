    <line x1="8" y1="24" x2="8" y2="24"/>
    <line x1="13" y1="18" x2="13" y2="30"/>
    <line x1="18" y1="12" x2="18" y2="36"/>
    <line x1="23" y1="19" x2="23" y2="29"/>
    <line x1="28" y1="9" x2="28" y2="39"/>
    <line x1="33" y1="16" x2="33" y2="32"/>
    <line x1="38" y1="20" x2="38" y2="28"/>
    <line x1="42" y1="24" x2="42" y2="24"/>
  </g>
</svg>
