<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e4b30"/>
      <stop offset="100%" stop-color="#06291a"/>
    </linearGradient>
  </defs>
  <!-- Squircle background — matches side-logo button radius -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#favBg)" stroke="#1f8a5b" stroke-width="1.5"/>
  <!--
    Logo waveform: exact same path as the in-app logo (viewBox 46×30),
    scaled to fit inside the 44×44 squircle with uniform padding.
    Scale: 38/46 ≈ 0.826 (width), 24/30 = 0.8 (height). Use 0.8 for both.
    Translate: center 46*0.8=36.8 → pad (44-36.8)/2+2 = 5.6; 30*0.8=24 → pad (44-24)/2+2 = 12
  -->
  <g transform="translate(5.6, 12) scale(0.8)" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
    <path d="M3 15h0M9 9v12M15 4v22M21 11v8M27 2v26M33 8v14M39 12v6M44 15h0"/>
  </g>
</svg>
